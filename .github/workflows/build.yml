name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android Platform
        run: cordova platform add android@13

      - name: Setup keystore
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          STORE_PASS="${KS_PASS:-dryer2026_release}"
          KEY_PW="${KEY_PASS:-dryer2026_release}"
          if [ -n "$KS_BASE64" ]; then
            echo ">>> Using keystore from secret"
            echo "$KS_BASE64" | base64 -d > release.keystore
          else
            echo ">>> Generating new keystore"
            keytool -genkey -v \
              -keystore release.keystore \
              -alias dryer-calc \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PW" \
              -dname "CN=DryerCalc, OU=Eng, O=Fantai, L=Hangzhou, ST=Zhejiang, C=CN"
          fi
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PW=$KEY_PW" >> $GITHUB_ENV

      - name: Build release AAB
        run: cordova build android --release

      - name: Convert AAB to APK (via bundletool)
        run: |
          AAB="platforms/android/app/build/outputs/bundle/release/app-release.aab"
          echo "AAB: $(du -h "$AAB" | cut -f1)"

          # Download bundletool
          wget -q https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar -O bundletool.jar

          # Build universal APK from AAB
          java -jar bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=app.apks \
            --mode=universal \
            --ks=release.keystore \
            --ks-pass=pass:"${STORE_PASS}" \
            --ks-key-alias=dryer-calc \
            --key-pass=pass:"${KEY_PW}"

          # Extract universal APK
          unzip -o app.apks universal.apk -d apk_out/
          cp apk_out/universal.apk app-release.apk
          ls -lh app-release.apk

          echo "APK_PATH=$PWD/app-release.apk" >> $GITHUB_ENV

      - name: Verify APK
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"
          echo "=== APK verified OK ==="

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dryer-calc-release-apk
          path: ${{ env.APK_PATH }}

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: release.keystore
