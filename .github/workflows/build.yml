name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android Platform
        run: cordova platform add android@13

      - name: Force APK build type
        run: |
          cd platforms/android
          echo "cdvBuildMultipleApks=true" >> gradle.properties
          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Setup keystore
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          STORE_PASS="${KS_PASS:-dryer2026_release}"
          KEY_PW="${KEY_PASS:-dryer2026_release}"
          if [ -n "$KS_BASE64" ]; then
            echo ">>> Using keystore from secret"
            echo "$KS_BASE64" | base64 -d > release.keystore
          else
            echo ">>> Generating new keystore"
            keytool -genkey -v \
              -keystore release.keystore \
              -alias dryer-calc \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PW" \
              -dname "CN=DryerCalc, OU=Eng, O=Fantai, L=Hangzhou, ST=Zhejiang, C=CN"
          fi
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PW=$KEY_PW" >> $GITHUB_ENV

      - name: Build release
        run: cordova build android --release

      - name: Find and sign APK
        run: |
          echo "=== Build outputs ==="
          find platforms/android -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null

          UNSIGNED=$(find platforms/android -path "*/release/*-release-unsigned.apk" -type f 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find platforms/android -path "*/release/*-unsigned.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$UNSIGNED" ]; then
            echo "=== No unsigned APK. Checking alternatives ==="
            find platforms/android -type f -name "*.apk" 2>/dev/null
            # Try AAB as fallback — for Google Play it's fine
            ls -la platforms/android/app/build/outputs/bundle/release/ 2>/dev/null
            exit 1
          fi

          echo "Signing: $UNSIGNED ($(du -h "$UNSIGNED" | cut -f1))"
          SIGNED="${UNSIGNED%-unsigned.apk}-signed.apk"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"${STORE_PASS}" \
            --key-pass pass:"${KEY_PW}" \
            --out "$SIGNED" \
            "$UNSIGNED"

          echo "=== Verify ==="
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$SIGNED"
          ls -lh "$SIGNED"
          echo "APK_PATH=$SIGNED" >> $GITHUB_ENV

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dryer-calc-release-apk
          path: ${{ env.APK_PATH }}

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: release.keystore
