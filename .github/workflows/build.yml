name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android Platform
        run: cordova platform add android@13

      - name: Setup keystore
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          STORE_PASS="${KS_PASS:-dryer2026_release}"
          KEY_PW="${KEY_PASS:-dryer2026_release}"

          if [ -n "$KS_BASE64" ]; then
            echo ">>> Using keystore from secret"
            echo "$KS_BASE64" | base64 -d > release.keystore
          else
            echo ">>> Generating new keystore (save as GitHub secret after first run)"
            keytool -genkey -v \
              -keystore release.keystore \
              -alias dryer-calc \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PW" \
              -dname "CN=DryerCalc, OU=Eng, O=Fantai, L=Hangzhou, ST=Zhejiang, C=CN"
          fi
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PW=$KEY_PW" >> $GITHUB_ENV

      - name: Build APK (via Gradle)
        working-directory: platforms/android
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          UNSIGNED="platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            echo "=== APK not found at expected path. Searching... ==="
            find platforms/android -name "*.apk" -type f
            find platforms/android -name "*.aab" -type f
            exit 1
          fi
          echo "Found APK: $UNSIGNED ($(du -h "$UNSIGNED" | cut -f1))"

          SIGNED="platforms/android/app/build/outputs/apk/release/app-release.apk"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"${STORE_PASS}" \
            --key-pass pass:"${KEY_PW}" \
            --out "$SIGNED" \
            "$UNSIGNED"

          echo "=== Verifying ==="
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$SIGNED"
          echo "Signed APK: $(du -h "$SIGNED" | cut -f1)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dryer-calc-release-apk
          path: platforms/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: release.keystore
